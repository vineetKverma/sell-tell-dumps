[project]
name = "voice-notes-logger"
version = "0.1.0"
description = "Agentic AI Voice Notes Logger - dynamic ADK Gemini Live dictation app for field sales reps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    # Pinned exactly: uv.lock, the Docker image and every branch run this one
    # version. [gcp] brings google-cloud-aiplatform, which the Agent Engine
    # session service needs at startup.
    "google-adk[gcp]==2.10.0",
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "google-cloud-bigquery>=3.42.2",
    "google-cloud-storage>=3.13.1",
    "google-cloud-bigquery-storage>=2.41.0",
    "pyarrow>=25.0.1",
]

# A dependency group rather than an optional-dependencies extra: `uv run` and
# `uv sync` install the `dev` group by default, so `uv run pytest tests/ -q`
# works with no flags. As an extra it needed `--extra dev`, and the bare command
# failed with "program not found".
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    # ADK's evaluation service (evals/adk_eval), same version as the app.
    "google-adk[eval]==2.10.0",
]
# Golden dataset curation (AIML-2898) only -- reading the .xlsb source export.
# Opt-in: `uv run --group dataset ...`. Kept out of `dev` so the unit tests
# don't pull in pandas.
dataset = [
    "pandas>=2.2.0",
    "pyxlsb>=1.0.10",
    "openpyxl>=3.1.0",
]

[tool.pytest.ini_options]
# Lets tests import the `evals` package from the repo root.
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehension
    "PL",  # Pylint rules
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff specific rules
]
ignore = [
    "E501",    # line length (long prompts, URLs)
    "PLR0913", # too many arguments
    "C901",    # too complex
    "PLR0915", # too many statements
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["app"]
